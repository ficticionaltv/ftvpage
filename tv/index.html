<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FicticionalTV · TV</title>
<meta name="description" content="FicticionalTV para televisión">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tv.css">
<link rel="icon" href="../img/favicon.png">
</head>
<body>

<div id="app" class="app">
  <!-- Barra lateral de navegación (se expande al enfocarla) -->
  <nav id="sidebar" class="sidebar" aria-label="Navegación principal">
    <div class="sb-logo">
      <img src="../img/favicon.png" alt="FicticionalTV" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="sb-logo-fallback">F<b>TV</b></span>
    </div>
    <ul class="sb-list" id="sb-list"></ul>
  </nav>

  <!-- Aquí se pinta cada pantalla (inicio, catálogo, ficha, etc.) -->
  <main id="screen" class="screen" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="js/tv.js"></script>
</body>
</html>
